<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheCawa</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #ff2222;
            --red-dim: #991111;
            --red-glow: rgba(255, 34, 34, 0.35);
            --bg: #080a0d;
            --card-bg: rgba(10, 10, 14, 0.88);
            --text: #e8e8e8;
            --muted: #666;
            --border: rgba(255, 34, 34, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
            cursor: crosshair;
        }

        /* Scanlines overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.07) 2px,
                rgba(0,0,0,0.07) 4px
            );
            pointer-events: none;
            z-index: 999;
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 16px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 44px 40px 36px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow:
                0 0 0 1px rgba(255,34,34,0.08),
                0 0 60px rgba(255,34,34,0.07),
                0 30px 80px rgba(0,0,0,0.7);
            animation: cardIn 1s cubic-bezier(0.16,1,0.3,1) both;
            position: relative;
            overflow: hidden;
        }

        /* Corner accents */
        .card::before,
        .card::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--red);
            border-style: solid;
        }
        .card::before {
            top: -1px; left: -1px;
            border-width: 2px 0 0 2px;
        }
        .card::after {
            bottom: -1px; right: -1px;
            border-width: 0 2px 2px 0;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Glitch horizontal line effect on card */
        .card-inner-border {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--red), transparent);
            animation: scanline-move 4s linear infinite;
            opacity: 0.6;
        }

        @keyframes scanline-move {
            0%   { top: 0%; }
            100% { top: 100%; }
        }

        /* Avatar */
        .avatar-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 24px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: block;
            border: 2px solid var(--red);
            box-shadow: 0 0 0 4px rgba(255,34,34,0.12), 0 0 30px rgba(255,34,34,0.2);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            animation: avatarIn 1s 0.2s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes avatarIn {
            from { opacity: 0; transform: scale(0.7); }
            to   { opacity: 1; transform: scale(1); }
        }

        .avatar:hover {
            transform: scale(1.06) rotate(4deg);
            box-shadow: 0 0 0 4px rgba(255,34,34,0.25), 0 0 50px rgba(255,34,34,0.4);
        }

        /* Status dot */
        .status-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 14px;
            height: 14px;
            background: #555;
            border-radius: 50%;
            border: 2px solid var(--bg); transition: background 0.5s ease, box-shadow 0.5s ease;
            /* animation: pulse-dot 2s ease infinite; */
        }
        .status-dot.online { background: #22ff66; animation: pulse-dot 2s ease infinite; }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34,255,102,0.4); }
            50%       { box-shadow: 0 0 0 6px rgba(34,255,102,0); }
        }

        /* Name */
        h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 34px;
            letter-spacing: 2px;
            color: #fff;
            animation: glitch-name 8s infinite;
            position: relative;
        }

        h1 span.cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background: var(--red);
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        @keyframes glitch-name {
            0%, 90%, 100% { text-shadow: none; transform: none; }
            91% {
                text-shadow: 2px 0 var(--red), -2px 0 #0ff;
                transform: skewX(-1deg);
            }
            93% {
                text-shadow: -2px 0 var(--red), 2px 0 #0ff;
                transform: skewX(1deg);
            }
            95% {
                text-shadow: none;
                transform: none;
            }
        }

        /* Tag line */
        .tag {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--red);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 6px 0 18px;
            opacity: 0.9;
        }

        /* Bio */
        .bio {
            color: #aaa;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 400;
            margin-bottom: 28px;
        }

        .bio strong {
            color: #ddd;
            font-weight: 600;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 22px 0;
            opacity: 0.4;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--red);
        }
        .divider span {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--red);
            letter-spacing: 2px;
        }

        /* Links */
        .links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .links a {
            text-decoration: none;
            color: #ccc;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,34,34,0.15);
            padding: 10px 12px;
            border-radius: 3px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .links a .icon {
            font-size: 14px;
            flex-shrink: 0;
        }

        .links a::before {
            content: '';
            position: absolute;
            left: -100%;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,34,34,0.08), transparent);
            transition: left 0.4s ease;
        }

        .links a:hover::before { left: 100%; }

        .links a:hover {
            border-color: var(--red);
            color: #fff;
            background: rgba(255,34,34,0.08);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255,34,34,0.15);
        }

        /* Links stagger animation */
        .links a:nth-child(1)  { animation: linkIn 0.5s 0.4s both; }
        .links a:nth-child(2)  { animation: linkIn 0.5s 0.5s both; }
        .links a:nth-child(3)  { animation: linkIn 0.5s 0.6s both; }
        .links a:nth-child(4)  { animation: linkIn 0.5s 0.7s both; }
        .links a:nth-child(5)  { animation: linkIn 0.5s 0.8s both; }
        .links a:nth-child(6)  { animation: linkIn 0.5s 0.9s both; }
        .links a:nth-child(7)  { animation: linkIn 0.5s 1.0s both; }
        .links a:nth-child(8)  { animation: linkIn 0.5s 1.1s both; }

        @keyframes linkIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .footer {
            margin-top: 28px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 2px;
        }

        .footer span {
            color: var(--red);
            opacity: 0.7;
        }
    </style>
</head>
<body>

<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const mouse = { x: null, y: null };
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

class Particle {
    constructor() { this.reset(true); }
    reset(random = false) {
        this.x = Math.random() * canvas.width;
        this.y = random ? Math.random() * canvas.height : -5;
        this.vx = (Math.random() - 0.5) * 0.7;
        this.vy = (Math.random() - 0.5) * 0.7;
        this.radius = Math.random() * 1.5 + 0.5;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.pulse = Math.random() * Math.PI * 2;
    }
    update() {
        this.pulse += 0.02;

        if (mouse.x && mouse.y) {
            const dx = this.x - mouse.x;
            const dy = this.y - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
                const force = (150 - dist) / 150;
                this.x += (dx / dist) * force * 3;
                this.y += (dy / dist) * force * 3;
            }
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
    }
    draw() {
        const r = this.radius + Math.sin(this.pulse) * 0.4;
        ctx.beginPath();
        ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 34, 34, ${this.opacity * (0.8 + Math.sin(this.pulse) * 0.2)})`;
        ctx.fill();
    }
}

const particles = Array.from({ length: 130 }, () => new Particle());

function connect() {
    for (let a = 0; a < particles.length; a++) {
        for (let b = a + 1; b < particles.length; b++) {
            const dx = particles[a].x - particles[b].x;
            const dy = particles[a].y - particles[b].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 110) {
                const alpha = (1 - dist / 110) * 0.18;
                ctx.strokeStyle = `rgba(255, 34, 34, ${alpha})`;
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(particles[a].x, particles[a].y);
                ctx.lineTo(particles[b].x, particles[b].y);
                ctx.stroke();
            }
        }
    }
}

// Subtle vignette
function drawVignette() {
    const grad = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, canvas.height * 0.3,
        canvas.width / 2, canvas.height / 2, canvas.height * 0.9
    );
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background gradient
    const bgGrad = ctx.createRadialGradient(
        canvas.width * 0.5, canvas.height * 0.4, 0,
        canvas.width * 0.5, canvas.height * 0.4, canvas.height
    );
    bgGrad.addColorStop(0, '#0f0a0a');
    bgGrad.addColorStop(1, '#080a0d');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (const p of particles) { p.update(); p.draw(); }
    connect();
    drawVignette();
    requestAnimationFrame(animate);
}

animate();

</script>
